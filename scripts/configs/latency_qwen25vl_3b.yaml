# Set model_path to a local Qwen2.5-VL-3B-Instruct directory.
results_root: runs/latency_qwen25vl_3b
model_path: /path/to/Qwen2.5-VL-3B-Instruct
model_name: Qwen2.5-VL-3B-Instruct-Replay
model_framework: qwen
sampling_fraction: 0.1
max_new_tokens: 2048
batch_size: 1
node_gpu_ids: "0"
tensor_parallel_size: 1
replay_modes:
  - image_text
  - image_text_image_text
cot_modes:
  - CoT
replay:
  replay_times: 1
  template_on_last_replay_text: 1
  image_copy_mode: reuse_path
  limit_mm_per_prompt: 2
  safe_fallback: 1
  safe_truncate_chars: 6000
vllm:
  max_num_seqs: 16
  max_model_len: 32768
  gpu_memory_utilization: 0.9
datasets:
  - DynaMath
  - MathVision
  - LogicVista
  - VisualPuzzles
  - AI2D_TEST
  - OCRBench
  - SEEDBench2_Plus
  - MMMU_DEV_VAL_SINGLE_IMAGE
  - WeMath
  - MMBench_DEV_EN_V11
  - MMStar
  - MathVista_MINI
